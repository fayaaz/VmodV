name: Nightly Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux nightly
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Compute nightly version
        run: |
          DATE=$(date -u +%Y%m%d)
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          echo "APP_VERSION=$BASE-nightly.$DATE" >> "$GITHUB_ENV"
          echo "NIGHTLY_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deb and AppImage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=linux
          cache-to: type=gha,mode=max,scope=linux

      - name: Publish nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --target main \
            --prerelease \
            --title "Nightly $NIGHTLY_DATE" \
            --notes "Automated nightly build from \`main\` ($NIGHTLY_DATE). Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/*.AppImage dist/*.deb

  native:
    name: Build native 2.0 nightly
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # native.yml lowers the Makefile's 20 GB guard for a stock runner; the
      # package build itself still needs several GB of Docker cache.
      MIN_FREE_GB: 8

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # Keep the rolling nightly distinguishable from a future stable 2.0.0.
      # The Makefile default is NATIVE_VERSION ?= 2.0.0.
      - name: Compute native nightly version
        run: |
          DATE=$(date -u +%Y%m%d)
          BASE=$(sed -n 's/^NATIVE_VERSION ?= *//p' Makefile | head -n 1)
          echo "NATIVE_VERSION=${BASE:-2.0.0}-nightly.$DATE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Build native AppImage and .deb
        run: |
          make appimage-native
          make native-deb

      - name: Inspect native installers
        run: |
          ls -lh dist
          dpkg-deb -I dist/VmodV-Native-*.deb

      # The Electron job above created the release and uploaded the Electron
      # installers; a native build failure must not remove that fallback.
      - name: Publish native installers
        run: |
          gh release upload nightly \
            dist/VmodV-Native-*.AppImage \
            dist/VmodV-Native-*.deb \
            --clobber
