name: Nightly Release

# Native-only nightly: lint, tests, AppImage and .deb packaging, published as
# the rolling `nightly` prerelease. There is no Electron/Node build any more;
# the final Electron tree is archived on branch legacy-electron (tag
# v1.x-final).
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  MIN_FREE_GB: 8

jobs:
  test:
    name: Native lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Clippy and rustfmt
        run: make engine-lint

      # Serial: the GPU/kittest suites share one lavapipe device and a
      # virtual display, just like modv-app below.
      - name: Workspace tests (modv-app excluded, serial)
        run: make engine-test ARGS="--workspace --exclude modv-app -- --test-threads=1"

      - name: modv-app unit tests (serial)
        run: make engine-test ARGS="-p modv-app --lib -- --test-threads=1"

      - name: Native e2e harness and parity tests (serial)
        run: make test-e2e-native

  package:
    name: Publish native nightly
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # Keep the rolling nightly distinguishable from a stable 2.0.0. The
      # Makefile default is NATIVE_VERSION ?= 2.0.0.
      - name: Compute native nightly version
        run: |
          DATE=$(date -u +%Y%m%d)
          BASE=$(sed -n 's/^NATIVE_VERSION ?= *//p' Makefile | head -n 1)
          echo "NATIVE_VERSION=${BASE:-2.0.0}-nightly.$DATE" >> "$GITHUB_ENV"
          echo "NIGHTLY_DATE=$DATE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Build native AppImage and .deb
        run: make build

      - name: Inspect native installers
        run: |
          ls -lh dist
          dpkg-deb -I dist/VmodV-Native-*.deb

      - name: Publish nightly release
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --target main \
            --prerelease \
            --title "Nightly $NIGHTLY_DATE" \
            --notes "Automated native Rust build from \`main\` ($NIGHTLY_DATE). Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/VmodV-Native-*.AppImage dist/VmodV-Native-*.deb
