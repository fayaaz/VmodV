name: Native Rust CI

# Rust-only lint/test/packaging for the native shell (docs/rust-full-rewrite.md
# P9). This workflow verifies every change and uploads workflow artifacts;
# nightly.yml publishes the same AppImage/.deb to the rolling nightly alongside
# the Electron build, which stays the fallback until the native shell is signed
# off.
on:
  push:
    branches:
      - main
      - rust-hybrid
    paths:
      - 'crates/**'
      - 'packaging/native/**'
      - 'tools/native-*'
      - 'resources/isf/**'
      - 'resources/point10/textures/**'
      - 'resources/icon.png'
      - 'LICENSE'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/native.yml'
  pull_request:
    branches:
      - main
      - rust-hybrid
    paths:
      - 'crates/**'
      - 'packaging/native/**'
      - 'tools/native-*'
      - 'resources/isf/**'
      - 'resources/point10/textures/**'
      - 'resources/icon.png'
      - 'LICENSE'
      - 'Makefile'
      - 'Dockerfile'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # `make` targets run disk-guard before building. Keep enough headroom for the
  # Rust target directory and the ~2.2 GB toolchain image on a stock runner.
  MIN_FREE_GB: 8

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Clippy and rustfmt
        run: make engine-lint

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain

      # modv-app's GPU tests share one lavapipe device and race when run in
      # parallel (`cargo test -p modv-app -- --test-threads=1` in the native
      # progress notes). The rest of the workspace runs normally.
      - name: Workspace tests (modv-app excluded)
        run: make engine-test ARGS="--workspace --exclude modv-app"

      - name: modv-app unit tests (serial)
        run: make engine-test ARGS="-p modv-app --lib -- --test-threads=1"

      # Launches the real `modv` binary under the Xvfb installed in the rust
      # image; lavapipe provides the Vulkan adapter. One worker only because a
      # process owns a virtual display and the software GPU is shared.
      - name: Native e2e process harness (serial)
        run: make engine-test ARGS="-p modv-app --test e2e_harness -- --test-threads=1"

  package:
    name: Native AppImage and .deb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain

      - name: Build native AppImage
        run: make appimage-native

      - name: Build native .deb
        run: make native-deb

      - name: Inspect installers
        run: |
          ls -lh dist
          dpkg-deb -I dist/VmodV-Native-*.deb
          dpkg-deb -c dist/VmodV-Native-*.deb | tail -n 5

      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-native-linux-x64
          path: |
            dist/VmodV-Native-*.AppImage
            dist/VmodV-Native-*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
