name: Release

# Automatic semantic versioning from conventional commits on `main`.
#
# Bump rules (highest precedence wins, see tools/semver-next.sh):
#   feat:                              -> minor   (2.1.0 -> 2.2.0)
#   fix:                               -> patch   (2.1.0 -> 2.1.1)
#   <type>! / BREAKING CHANGE:         -> major   (2.1.0 -> 3.0.0)
#   anything else (chore, docs, perf…) -> no release
#
# Every push to `main` that contains qualifying commits cuts a release: the
# workflow computes the next version, tags the pushed commit `vX.Y.Z` (no
# version-bump commit is made — the tree keeps no version literal, the tags
# are the source of truth) and creates the GitHub release as a draft
# immediately. `validate` then runs lint and the test suite, and `publish`
# flips the draft visible only if both succeed. Each artifact is built once by
# its own job and attached by a separate `attach-*` job once that build has
# produced it, so a failed/slow platform build can cost an asset but can never
# stop the release going out. Versions are tagged `vX.Y.Z`; the `v2.0.0` tag
# seeds the base for the first automated release (v2.1.0). Commits without
# feat:/fix:/breaking types do not produce a release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  MIN_FREE_GB: 8
  # Bind-mounted into the Docker toolchain as /cargo so the cargo registry and
  # git checkouts survive across runs (actions/cache restores this directory).
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    # Manual runs are restricted to main: dispatching from a feature branch
    # must not tag and publish a release from that branch. Push events are
    # unaffected because they already target `main`.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous_tag: ${{ steps.next.outputs.previous_tag }}
      should_release: ${{ steps.next.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          VERSION=$(tools/semver-next.sh)
          if [ -z "$VERSION" ]; then
            echo "No qualifying commits since the last tag; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On a resumed run the tag being released is already at HEAD and is
          # the highest tag; it must not become its own "previous" release.
          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -F -x "v${VERSION}" | head -n1 || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Next release: v$VERSION (previous tag: ${PREV:-none})"

  # The single owner of lint and the full test suite on main pushes:
  # vmodv.yml's lint/test jobs stand down for that ref so the same commit is
  # checked exactly once. This job gates `publish` only — the draft is created
  # first, so a failure here leaves an unpublished draft instead of exposing a
  # stable release. It runs on every main push, including those that do not cut
  # a release, so those commits are still validated once. No build job is
  # involved, so publication never waits for an artifact.
  validate:
    name: Lint and test before publishing
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 120
    env:
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Clippy and rustfmt
        run: make engine-lint

      # Same split as vmodv.yml: the GPU/kittest suites share one lavapipe
      # device, so the workspace runs serial and modv-app is run separately.
      - name: Workspace tests (modv-app excluded, serial)
        run: make engine-test ARGS="--workspace --exclude modv-app -- --test-threads=1"

      - name: modv-app unit tests (serial)
        run: make engine-test ARGS="-p modv-app --lib -- --test-threads=1"

      # The remaining integration/e2e coverage vmodv.yml runs on PRs. Kept in
      # the same job so main pushes run the full suite once and `publish` waits
      # for all of it, not just the unit tests.
      - name: VmodV AppImage bundle check tests (serial)
        run: make engine-test ARGS="-p modv-app --test appimage_bundle -- --test-threads=1"

      - name: Portable Windows ZIP layout test (Linux dry-run)
        run: make engine-test ARGS="-p modv-app --test windows_portable_layout -- --test-threads=1"

      - name: modv-app static and packaging guard tests (serial)
        run: make engine-test ARGS="-p modv-app --test appimage_arm64 --test branding --test ci_docker_cache --test ci_test_coverage --test deb_package --test macos_portable_layout --test media_probe --test module_docs --test ndi_readback --test notices --test pages_workflow --test release_resilience --test release_resume --test removed_content --test undo_history -- --test-threads=1"

      - name: VmodV e2e harness and parity tests (serial)
        run: make test-e2e-vmodv

  # Builds the AppImages separately from the `release` job so a Docker/toolchain
  # failure cannot stop the release from being tagged and published. Each
  # architecture builds natively on its own runner (`ubuntu-24.04-arm` for
  # arm64) and uploads a distinct artifact; `attach-appimage` attaches whichever
  # images arrived.
  build-appimage:
    name: Build Linux AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            artifact: vmodv-appimage-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: vmodv-appimage-aarch64
    runs-on: ${{ matrix.runner }}
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Per-architecture toolchain cache, shared with build-push-action above.
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-toolchain-${{ matrix.arch }}

      - name: Build VmodV AppImage
        run: make appimage-vmodv
        env:
          VMODV_VERSION: ${{ env.VERSION }}

      - name: Verify the fat AppImage bundle before publishing
        run: make vmodv-appimage-check
        env:
          VMODV_VERSION: ${{ env.VERSION }}

      - name: Inspect AppImage
        run: ls -lh dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/VmodV-*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Builds the portable Windows ZIP for the release. Kept separate from the
  # Linux publish job so a Windows toolchain/MSI failure cannot block tagging.
  # `attach-windows` attaches this artifact after the release exists, so a
  # failure here costs the Windows ZIP, nothing more.
  windows-portable:
    name: Build portable Windows ZIP
    runs-on: windows-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache GStreamer MSIs
        uses: actions/cache@v4
        with:
          path: .gst-cache
          key: ${{ runner.os }}-gstreamer-msi-1.24.13-pkgconf-3.0.11

      - name: Install x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install GStreamer 1.24 (MSVC, runtime + devel)
        shell: pwsh
        run: |
          $base = 'https://gstreamer.freedesktop.org/data/pkg/windows/1.24.13/msvc'
          $runtime = "$base/gstreamer-1.0-msvc-x86_64-1.24.13.msi"
          $devel = "$base/gstreamer-1.0-devel-msvc-x86_64-1.24.13.msi"
          New-Item -ItemType Directory -Force -Path '.gst-cache' | Out-Null
          $runtimeMsi = "$pwd\.gst-cache\gst-runtime.msi"
          $develMsi = "$pwd\.gst-cache\gst-devel.msi"
          if (-not (Test-Path $runtimeMsi)) {
            Invoke-WebRequest -Uri $runtime -OutFile $runtimeMsi
          }
          if (-not (Test-Path $develMsi)) {
            Invoke-WebRequest -Uri $devel -OutFile $develMsi
          }
          $runtimeInstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $runtimeMsi, '/quiet', '/norestart', 'INSTALLDIR=C:\gstreamer\1.0\msvc_x86_64', '/L*V', "$pwd\.gst-cache\gst-runtime-install.log"
          if ($runtimeInstall.ExitCode -ne 0) { throw "GStreamer runtime MSI install failed with exit code $($runtimeInstall.ExitCode)" }
          $develInstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $develMsi, '/quiet', '/norestart', 'INSTALLDIR=C:\gstreamer\1.0\msvc_x86_64', '/L*V', "$pwd\.gst-cache\gst-devel-install.log"
          if ($develInstall.ExitCode -ne 0) { throw "GStreamer devel MSI install failed with exit code $($develInstall.ExitCode)" }
          # Chocolatey's feed is flaky; install pinned pkgconf MSI directly and cache it.
          $pkgconfMsi = Join-Path $pwd '.gst-cache\pkgconf-x64-3.0.11.msi'
          if (-not (Test-Path $pkgconfMsi)) {
            Invoke-WebRequest -Uri 'https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.11/pkgconf-x64-3.0.11.msi' -OutFile $pkgconfMsi
          }
          $digest = (Get-FileHash -Path $pkgconfMsi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'ea99c87ab4a3dd8799d47ef196f66ca57d274ec4f49b25d2f48b7c9d9df0eb96') { throw "pkgconf MSI checksum mismatch: $digest" }
          $pkgconfInstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', $pkgconfMsi, '/quiet', '/norestart'
          if ($pkgconfInstall.ExitCode -ne 0) { throw "pkgconf MSI install failed with exit code $($pkgconfInstall.ExitCode)" }
          # The MSI updates PATH only for future processes, so the runner's
          # captured PATH still lacks pkgconf; refresh it from the registry and
          # export the resolved absolute path (a bare name fails in glib-sys).
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $pkgconf = (Get-Command pkgconf.exe -ErrorAction Stop).Source
          "PKG_CONFIG=$pkgconf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=/gst-pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $libFile = Get-ChildItem -Path 'C:\gstreamer', "$env:SystemDrive\gstreamer" -Filter 'gstvideo-1.0.lib' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libFile) { throw 'gstvideo-1.0.lib not found under the GStreamer install' }
          $libDir = $libFile.DirectoryName
          "RUSTFLAGS=-L$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gstRoot = (Split-Path -Parent $libDir).Replace('\','/')
          "GSTREAMER_ROOT=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # pkgconf 3.0.10 also splits PKG_CONFIG_PATH on ':', so a drive-letter
          # path is mangled. Stage the devel .pc files into a colon-free root-level
          # gst-pkgconfig directory on both the system drive and the workspace
          # drive (registry crates build from C:, workspace crates from D:).
          $pcFile = Get-ChildItem -Path 'C:\gstreamer' -Filter 'glib-2.0.pc' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pcFile) { throw 'glib-2.0.pc not found under C:\gstreamer after the GStreamer MSI install' }
          $gstPc = $pcFile.DirectoryName
          $targets = @("$env:SystemDrive\gst-pkgconfig")
          $wsDrive = (Get-Location).Drive.Name
          if ($wsDrive -ne $env:SystemDrive.TrimEnd(':')) { $targets += "${wsDrive}:\gst-pkgconfig" }
          foreach ($target in $targets) {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Path "$gstPc\*.pc" -Destination $target -Force
          }

      - name: Configure GStreamer build environment
        shell: bash
        run: |
          echo "C:/gstreamer/1.0/msvc_x86_64/bin" >> "$GITHUB_PATH"

      - name: Build modv (x86_64-pc-windows-msvc, release)
        shell: pwsh
        run: cargo build --release --manifest-path crates/Cargo.toml -p modv-app --bin modv --target x86_64-pc-windows-msvc

      - name: Stage portable layout
        shell: bash
        run: |
          bash tools/windows-portable.sh \
            --root "$PWD/dist/windows-portable" \
            --binary "$PWD/crates/target/x86_64-pc-windows-msvc/release/modv.exe" \
            --gstreamer-root "$GSTREAMER_ROOT" \
            --project-root "$PWD"

      - name: Zip portable layout
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-portable'
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\VmodV-Windows-x86_64-portable-$env:VERSION.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal
          Get-Item $out | Select-Object FullName, Length

      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-windows-x86_64-portable
          path: dist/VmodV-Windows-x86_64-portable-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Builds portable macOS .app bundles for both architectures (Intel x86_64
  # and Apple Silicon arm64) for the release. Kept separate from the Linux
  # publish job so a macOS toolchain/signing failure cannot block tagging.
  # Both runner labels are pinned: the unpinned default arm64 runner was
  # repeatedly unavailable in CI due to capacity constraints. `attach-macos`
  # attaches both artifacts after the release exists; a runner that never
  # starts only costs the macOS ZIPs, not the release itself. The matrix has
  # `fail-fast: false` and the attach job treats each architecture separately,
  # so one failed leg still publishes the other's ZIP.
  macos-portable:
    name: Build portable macOS app bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            artifact: vmodv-macos-x86_64-portable
            zip_prefix: VmodV-macOS-x86_64-portable-
          - arch: arm64
            runner: macos-15
            artifact: vmodv-macos-arm64-portable
            zip_prefix: VmodV-macOS-arm64-portable-
    runs-on: ${{ matrix.runner }}
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/version.sh derives the version from tags.

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer (Homebrew)
        # gstreamer-sys build scripts use pkg-config to find the GStreamer
        # libraries, so the devel headers/pkgconfig files are required.
        run: brew install pkg-config gstreamer gst-plugins-base

      - name: Configure GStreamer pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build modv (release)
        run: cargo build --release --manifest-path crates/Cargo.toml -p modv-app --bin modv

      - name: Resolve version
        run: echo "MACOS_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Stage portable app bundle
        run: |
          bash tools/macos-portable.sh \
            --root "$PWD/dist/macos-portable-${{ matrix.arch }}" \
            --binary "$PWD/crates/target/release/modv" \
            --project-root "$PWD"

      - name: Ad-hoc codesign the .app
        # Ad-hoc signing lets the bundled binary run without notarization.
        # continue-on-error keeps packaging/upload working on runners where
        # signing is unavailable.
        continue-on-error: true
        run: codesign --force --deep --sign - "$PWD/dist/macos-portable-${{ matrix.arch }}/VmodV.app"

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$PWD/dist/macos-portable-${{ matrix.arch }}" \
            "$PWD/dist/${{ matrix.zip_prefix }}$MACOS_VERSION.zip"

      - name: Upload portable macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip_prefix }}*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Build one host-dependent .deb per supported Ubuntu base. Kept separate
  # from the release job so a slow or flaky Ubuntu leg cannot delay tagging:
  # the debs are attached after the release already exists.
  linux-debs:
    name: Build Ubuntu .deb (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            suffix: -ubuntu24.04
            cache_scope: ubuntu-24-04
            name: vmodv-deb-ubuntu24.04
          - image: ubuntu:26.04
            suffix: -ubuntu26.04
            cache_scope: ubuntu-26-04
            name: vmodv-deb-ubuntu26.04
          - image: ubuntu:26.10
            suffix: -ubuntu26.10
            cache_scope: ubuntu-26-10
            name: vmodv-deb-ubuntu26.10
          - image: ubuntu:devel
            suffix: -ubuntudevel
            cache_scope: ubuntu-devel
            name: vmodv-deb-ubuntudevel
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Each Ubuntu base has its own layer stack, so scope its toolchain cache
      # separately; `make vmodv-deb` builds the image through `docker-rust`.
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain-${{ matrix.cache_scope }} --cache-to type=gha,mode=max,scope=rust-toolchain-${{ matrix.cache_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `make vmodv-deb` builds the toolchain image itself (docker-rust) with
      # the GHA cache args from DOCKER_BUILD_ARGS above; no separate uncached
      # `docker build` step is needed.
      - name: Build Ubuntu .deb
        run: make vmodv-deb BASE_IMAGE="${{ matrix.image }}"
        env:
          VMODV_VERSION: ${{ env.VERSION }}
          DEB_SUFFIX: ${{ matrix.suffix }}

      - name: Upload Ubuntu .deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/VmodV-*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-debs:
    name: Publish Ubuntu .debs
    # The release job tags the commit and creates the draft; this job attaches
    # only the four per-Ubuntu .debs once the draft exists, so a slow Ubuntu
    # leg cannot block tagging or publication.
    runs-on: ubuntu-latest
    needs: [version, release, linux-debs]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ubuntu debs
        uses: actions/download-artifact@v4
        with:
          pattern: vmodv-deb-*
          merge-multiple: true
          path: dist

      - name: Upload Ubuntu debs to the release
        run: gh release upload "v${VERSION}" dist/VmodV-*.deb --clobber

  # Tags the commit and creates the GitHub release as a *draft* as soon as the
  # version is known. No build job is in `needs`: a slow, flaky or
  # capacity-starved platform leg must never stop the draft from being tagged.
  # The draft stays invisible until `validate` passes and `publish` flips it;
  # build artifacts are uploaded by the `attach-*` jobs only when their own
  # build succeeded (see the comment on each attach job).
  release:
    name: Tag and draft GitHub release
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PREV_TAG: ${{ needs.version.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag v${{ env.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists; leaving it in place."
          else
            git tag -a "v${VERSION}" -m "VmodV ${VERSION}"
          fi
          git push origin "refs/tags/v${VERSION}"

      - name: Generate release notes
        run: |
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..v${VERSION}"; else RANGE="v${VERSION}"; fi
          {
            echo "Automated release cut from \`main\` by the semantic-versioning workflow."
            echo
            echo "## Changes"
            git log --no-merges --format='- %s (%h)' "$RANGE"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${VERSION}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create draft GitHub release
        run: |
          # Create a *draft* with notes only, never build files: it stays
          # invisible if validation fails, and a missing artifact cannot make
          # creation fail. Idempotent so a re-run can still attach.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; leaving it in place."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --draft \
              --notes-file release-notes.md
          fi

  # Makes the validated draft visible. `needs` deliberately contains no build
  # job: platform artifacts may attach before or after publication, and a
  # failed build must not keep a validated release hidden.
  publish:
    name: Publish the validated GitHub release
    runs-on: ubuntu-latest
    needs: [version, release, validate]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gh cannot infer OWNER/REPO without a checkout, so state it explicitly.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Publish the validated draft
        run: gh release edit "v${VERSION}" --draft=false

  # Each attach job waits for the release and for one build job with the
  # default `success()` status check: a failed build skips only its own attach
  # step, never the release and never the other platforms' artifacts. The
  # matrix attach jobs are the exception: `build-appimage` and `macos-portable`
  # share one job between architectures, so they must still run when one leg
  # fails and attach whichever artifacts exist.
  attach-appimage:
    name: Attach Linux AppImages to release
    runs-on: ubuntu-latest
    needs: [version, release, build-appimage]
    # A two-leg matrix job reports failure when either architecture fails, so
    # the default `success()` check would skip this job and drop the image of
    # the architecture that did build. Run whenever the release exists (unless
    # the run was cancelled); each download is best-effort and the upload
    # attaches whatever arrived.
    if: ${{ !cancelled() && needs.version.outputs.should_release == 'true' && needs.release.result == 'success' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # gh infers OWNER/REPO from the git remote; without a checkout the upload
      # fails with "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v4

      # A missing architecture must not abort attachment of the surviving one,
      # so a failed wildcard download only fails this step, not the job.
      - name: Download AppImages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vmodv-appimage-*
          merge-multiple: true
          path: dist

      - name: Upload AppImages to the release
        run: |
          shopt -s nullglob
          images=(dist/*.AppImage)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::warning::No AppImages were produced; nothing to attach."
            exit 0
          fi
          printf 'Attaching %s\n' "${images[@]}"
          gh release upload "v${VERSION}" "${images[@]}" --clobber

  attach-windows:
    name: Attach portable Windows ZIP to release
    runs-on: ubuntu-latest
    needs: [version, release, windows-portable]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # gh infers OWNER/REPO from the git remote; without a checkout the upload
      # fails with "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: vmodv-windows-x86_64-portable
          path: dist-windows

      - name: Upload portable Windows ZIP to the release
        run: gh release upload "v${VERSION}" dist-windows/*.zip --clobber

  attach-macos:
    name: Attach portable macOS ZIPs to release
    runs-on: ubuntu-latest
    needs: [version, release, macos-portable]
    # A two-leg matrix job reports failure when either architecture fails, so
    # the default `success()` check would skip this job and drop the ZIP of the
    # architecture that did build. Run whenever the release exists (unless the
    # run was cancelled); each download below is best-effort, and the upload
    # step attaches whatever arrived.
    if: ${{ !cancelled() && needs.version.outputs.should_release == 'true' && needs.release.result == 'success' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # gh infers OWNER/REPO from the git remote; without a checkout the upload
      # fails with "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v4

      # A failed or absent architecture must not sink the other one, so a
      # missing artifact only marks this step as failed, not the job.
      - name: Download portable macOS ZIP (x86_64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vmodv-macos-x86_64-portable
          path: dist-macos

      - name: Download portable macOS ZIP (arm64)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vmodv-macos-arm64-portable
          path: dist-macos

      - name: Upload portable macOS ZIPs to the release
        run: |
          shopt -s nullglob
          zips=(dist-macos/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::warning::No macOS ZIPs were produced; nothing to attach."
            exit 0
          fi
          printf 'Attaching %s\n' "${zips[@]}"
          gh release upload "v${VERSION}" "${zips[@]}" --clobber

