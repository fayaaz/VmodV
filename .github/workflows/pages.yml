name: GitHub Pages — module catalogue

# This repository serves Pages from the `gh-pages` branch (the `github-pages`
# environment only allows that branch). So the workflow builds the catalogue
# from the Rust tree and publishes it into `gh-pages` under /modules/, keeping
# the hand-maintained front page intact.
on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'resources/isf/**'
      - 'docs/**'
      - 'tools/build-preview-wasm.sh'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'resources/isf/**'
      - 'docs/**'
      - 'tools/build-preview-wasm.sh'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MIN_FREE_GB: 8
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  build:
    name: Build and publish the module catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain

      - name: Build WebAssembly toolchain image
        run: docker build --target wasm -t modv-wasm:local .

      - name: Regenerate the catalogue from the registry
        run: make module-docs

      - name: Rebuild the WebAssembly preview runtime
        run: make preview-wasm

      # The JSON is deterministic; if it changes in CI, the committed copy is
      # stale. The .wasm blob can vary with the Rust toolchain patch version,
      # so it is rebuilt but not diffed here.
      - name: Check the committed catalogue is up to date
        run: git diff --exit-code -- docs/modules/modules.json docs/modules/previews.json

      - name: Checkout the gh-pages branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Stage the catalogue into gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p gh-pages/modules gh-pages/assets/wasm
          cp -R docs/modules/. gh-pages/modules/
          cp docs/assets/site.css docs/assets/catalog.js docs/assets/preview.js docs/assets/icon.png gh-pages/assets/
          cp docs/assets/wasm/*.js docs/assets/wasm/*.wasm gh-pages/assets/wasm/

      - name: Commit and push to gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; nothing to publish."
          else
            git commit -m "docs(site): refresh module catalogue from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
