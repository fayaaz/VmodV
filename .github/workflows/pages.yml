name: GitHub Pages — VmodV browser

# Pages is served from the `gh-pages` branch (the `github-pages` environment
# only permits that branch). The module gallery has been replaced by the real
# browser shell: /modules/ and /app/ now serve the wasm client, and the old
# catalogue assets are removed from gh-pages. The hand-maintained root page is
# left intact.
on:
  # Every push to main republishes the browser shell. No path filter: a main
  # update is the deployment trigger, even when the change is docs-only.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'resources/isf/**'
      - 'web/**'
      - 'tools/build-web.sh'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MIN_FREE_GB: 8
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  build:
    name: Build and publish the browser shell
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebAssembly toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wasm
          tags: modv-wasm:local
          load: true
          cache-from: type=gha,scope=wasm-toolchain

      - name: Build the browser shell
        run: make web-build

      - name: Checkout the gh-pages branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Replace the gallery with the browser shell
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          rm -rf gh-pages/modules gh-pages/app gh-pages/assets/wasm
          mkdir -p gh-pages/modules gh-pages/app

          # Primary URL: the old gallery location now boots the real app.
          cp -R web/. gh-pages/modules/

          # Keep the earlier /app/ link working without duplicating the
          # 18 MB wasm payload.
          cat > gh-pages/app/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../modules/">
          <title>VmodV — browser</title>
          <a href="../modules/">Open the VmodV browser shell</a>
          EOF

          # Catalogue-only runtime files are no longer referenced.
          rm -f gh-pages/assets/catalog.js gh-pages/assets/preview.js

      - name: Commit and push to gh-pages
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Browser shell unchanged; nothing to publish."
          else
            git commit -m "feat(site): publish the VmodV browser shell from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
