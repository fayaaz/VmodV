name: GitHub Pages — VmodV browser

# Pages deploys from a GitHub Actions artifact on every push to `main`. The
# real browser shell is the site root; the old /modules/ and /app/ links
# redirect there.
on:
  # Every push to main republishes the browser shell. No path filter: a main
  # update is the deployment trigger, even when the change is docs-only.
  # Pages is never deployed from a pull request or another branch.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MIN_FREE_GB: 8
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  build:
    name: Build the browser shell
    # Only `main` publishes. A manual dispatch from another branch is a no-op.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebAssembly toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wasm
          tags: modv-wasm:local
          load: true
          cache-from: type=gha,scope=wasm-toolchain
          cache-to: type=gha,mode=max,scope=wasm-toolchain

      - name: Build the browser shell
        run: make web-build
        env:
          DOCKER_BUILD_ARGS: --cache-from type=gha,scope=wasm-toolchain

      - name: Stage the site
        run: |
          rm -rf _site
          mkdir -p _site

          # The real app is the site root.
          cp -R web/. _site/

          # Keep the earlier /modules/ and /app/ links working without
          # duplicating the 18 MB wasm payload.
          mkdir -p _site/modules _site/app
          cat > _site/modules/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <title>VmodV — browser</title>
          <a href="../">Open the VmodV browser shell</a>
          EOF
          cp _site/modules/index.html _site/app/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
