name: GitHub Pages — VmodV browser

# Pages is served from the `gh-pages` branch (the `github-pages` environment
# only permits that branch). The real browser shell is the site root; the old
# /modules/ and /app/ links redirect there, and the catalogue assets are
# removed from gh-pages.
on:
  # Every push to main republishes the browser shell. No path filter: a main
  # update is the deployment trigger, even when the change is docs-only.
  # Pages is never deployed from a pull request or another branch.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MIN_FREE_GB: 8
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  build:
    name: Build and publish the browser shell
    # Only `main` publishes. A manual dispatch from another branch is a no-op.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pages-cargo-

      - name: Prepare cargo cache mounts
        run: |
          mkdir -p .cargo-cache crates/target
          chmod -R a+rwX .cargo-cache crates/target

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebAssembly toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wasm
          tags: modv-wasm:local
          load: true
          cache-from: type=gha,scope=wasm-toolchain

      - name: Build the browser shell
        run: make web-build

      - name: Checkout the gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish the browser shell at the site root
        run: |
          rm -rf gh-pages/modules gh-pages/app gh-pages/assets/wasm
          rm -f gh-pages/assets/catalog.js gh-pages/assets/preview.js

          # The real app is the site root.
          cp -R web/. gh-pages/

          # Keep the earlier /modules/ and /app/ links working without
          # duplicating the 18 MB wasm payload.
          mkdir -p gh-pages/modules gh-pages/app
          cat > gh-pages/modules/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <title>VmodV — browser</title>
          <a href="../">Open the VmodV browser shell</a>
          EOF
          cp gh-pages/modules/index.html gh-pages/app/index.html

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Browser shell unchanged; nothing to publish."
          else
            git commit -m "feat(site): publish the VmodV browser shell from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
