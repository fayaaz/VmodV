name: VmodV Rust CI

# Rust-only lint/test/packaging for the VmodV shell. Every change is built,
# tested and packaged without Node, Yarn or Electron. Stable releases are
# published by release.yml (see docs/releasing.md).
on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'resources/**'
      - 'packaging/vmodv/**'
      - 'tools/vmodv-*'
      - 'tools/windows-portable.sh'
      - 'tests/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'resources/**'
      - 'packaging/vmodv/**'
      - 'tools/vmodv-*'
      - 'tools/windows-portable.sh'
      - 'tests/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmodv-${{ github.ref }}
  cancel-in-progress: true

env:
  # `make` targets run disk-guard before building. Keep enough headroom for the
  # Rust target directory and the toolchain image on a stock runner.
  MIN_FREE_GB: 8
  # Bind-mounted into the Docker toolchain as /cargo so the cargo registry and
  # git checkouts survive across runs (actions/cache restores this directory).
  CARGO_VOLUME: ${{ github.workspace }}/.cargo-cache

jobs:
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # release.yml's `validate` job lints main and gates publication on it.
    # Stand down for that ref (including manual runs) so the same commit is
    # never linted twice; PRs and other branches still use this job.
    if: ${{ github.ref != 'refs/heads/main' }}
    env:
      # Feed the GHA cache into make's Buildx image build (`docker-rust`) so
      # the image built above is reused instead of rebuilt from apt.
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Prepare Linux runner
        uses: ./.github/actions/prepare-linux-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      - name: Clippy and rustfmt
        run: make engine-lint

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # release.yml's `validate` job runs the same full suite on main and gates
    # publication on it. Skip that ref here (including manual runs) so tests
    # run once per commit; PRs and other branches still use this job.
    if: ${{ github.ref != 'refs/heads/main' }}
    env:
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain
      # Run the canonical suites under cargo-llvm-cov; `coverage-report` below
      # merges their profiles into an HTML artifact. All steps share this
      # runner's target dir, so the object files still match the profiles.
      COVERAGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Prepare Linux runner
        uses: ./.github/actions/prepare-linux-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain
          cache-to: type=gha,mode=max,scope=rust-toolchain

      # modv-app's GPU tests share one lavapipe device and race when run in
      # parallel (`cargo test -p modv-app -- --test-threads=1`). The rest of
      # the workspace runs normally.
      # Serial: the GPU/kittest suites share one lavapipe device and a
      # virtual display, just like modv-app below.
      - name: Workspace tests (modv-app excluded, serial)
        run: make engine-test ARGS="--workspace --exclude modv-app -- --test-threads=1 --skip test_gpu"

      - name: modv-app unit tests (serial)
        run: make engine-test ARGS="-p modv-app --lib -- --test-threads=1"

      # Static/packaging/CI guards: bundle fixtures, platform layouts,
      # notices, release plumbing and the REL-03 coverage guard itself. The
      # `--test` list lives in the Makefile's `test-static-guards` recipe so
      # release.yml's validation runs exactly the same set.
      - name: modv-app static and packaging guard tests (serial)
        run: make test-static-guards

      # GPU shader units use the same lavapipe device as the e2e processes, so
      # they run in this job immediately before e2e, never in parallel.
      - name: GPU shader unit tests (serial)
        run: make test-shader-gpu

      # Launches the real `modv` binary under Xvfb; lavapipe provides the
      # Vulkan adapter. One worker only because a process owns a virtual
      # display and the software GPU is shared.
      - name: VmodV e2e harness and parity tests (serial)
        run: make test-e2e-vmodv

      # Built after every suite: merging profiles while the instrumented
      # binaries are still in the target dir keeps coverage mappings aligned.
      - name: Generate line coverage report
        run: make coverage-report

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-coverage-html
          path: coverage/html
          if-no-files-found: error
          retention-days: 7

  package:
    name: VmodV installers (${{ matrix.arch }})
    # release.yml builds and publishes these installers on every main push.
    # Skip the duplicate build on that ref; PRs and other branches still
    # package so packaging regressions are caught before they reach main.
    if: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Per-architecture toolchain cache, shared with build-push-action above.
      DOCKER_BUILD_ARGS: --cache-from type=gha,scope=rust-toolchain-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tools/version.sh derives the installer version from the tags
          fetch-depth: 0

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            .cargo-cache
            crates/target
          key: ${{ runner.os }}-ci-${{ matrix.arch }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-${{ matrix.arch }}-cargo-

      - name: Prepare Linux runner
        uses: ./.github/actions/prepare-linux-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: rust
          tags: modv-rust:local
          load: true
          cache-from: type=gha,scope=rust-toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-toolchain-${{ matrix.arch }}

      # The .deb packaging is host-dependent and stays amd64-only, so the
      # x86_64 leg keeps running the canonical `make build` (AppImage + .deb).
      - name: Build VmodV AppImage and .deb
        if: matrix.arch == 'x86_64'
        run: make build

      # arm64 builds only the native AppImage; there is no arm64 .deb.
      - name: Build VmodV AppImage
        if: matrix.arch == 'aarch64'
        run: make appimage

      - name: Verify the fat AppImage bundle
        run: make vmodv-appimage-check

      - name: Inspect installers
        if: matrix.arch == 'x86_64'
        run: |
          ls -lh dist
          dpkg-deb -I dist/VmodV-*.deb
          dpkg-deb -c dist/VmodV-*.deb | tail -n 5

      - name: Upload VmodV installers (x86_64)
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-linux-x64
          path: |
            dist/VmodV-*.AppImage
            dist/VmodV-*.deb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload VmodV AppImage (arm64)
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-linux-arm64
          path: dist/VmodV-*.AppImage
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Portable Windows ZIP. Linux is the release target; this job verifies that
  # the codebase cross-builds for x86_64-pc-windows-msvc and that the staging
  # script produces a self-contained layout. Camera/screen capture (v4l2src /
  # pipewiresrc) remains Linux-only at runtime and is not ported here.
  windows-portable:
    name: Portable Windows ZIP (x86_64)
    # release.yml builds the portable ZIP on every main push. Skip the
    # duplicate Windows/GStreamer build on that ref; PRs still build it.
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/version.sh derives the version from git tags

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-cargo-

      - name: Cache GStreamer MSIs
        uses: actions/cache@v4
        with:
          path: .gst-cache
          key: ${{ runner.os }}-gstreamer-msi-1.24.13-pkgconf-3.0.11

      - name: Install x86_64-pc-windows-msvc target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install GStreamer 1.24 (MSVC, runtime + devel)
        shell: pwsh
        run: pwsh tools/setup-windows-gstreamer.ps1

      - name: Build modv (x86_64-pc-windows-msvc, release)
        shell: pwsh
        run: cargo build --release --manifest-path crates/Cargo.toml -p modv-app --bin modv --target x86_64-pc-windows-msvc

      - name: Resolve version
        shell: bash
        run: echo "PORTABLE_VERSION=$(bash tools/version.sh)" >> "$GITHUB_ENV"

      - name: Stage portable layout
        shell: bash
        run: |
          bash tools/windows-portable.sh \
            --root "$PWD/dist/windows-portable" \
            --binary "$PWD/crates/target/x86_64-pc-windows-msvc/release/modv.exe" \
            --gstreamer-root "$GSTREAMER_ROOT" \
            --project-root "$PWD"

      - name: Zip portable layout
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-portable'
          $out = Join-Path $env:GITHUB_WORKSPACE "dist\VmodV-Windows-x86_64-portable-$env:PORTABLE_VERSION.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal
          Get-Item $out | Select-Object FullName, Length

      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vmodv-windows-x86_64-portable
          path: dist/VmodV-Windows-x86_64-portable-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
