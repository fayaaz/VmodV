name: macOS Portable App

# Build portable VmodV.app bundles for both macOS architectures (Intel
# x86_64 and Apple Silicon arm64) and upload them as CI artifacts. Runs on
# every push so feature branches (e.g. feat/macos-build) can be verified by
# pushing without opening a PR.
#
# Both architectures use explicitly pinned runner labels:
#   * x86_64 -> macos-15-intel
#   * arm64  -> macos-15
# The unpinned default arm64 runner label was repeatedly unavailable in CI
# ("capacity constraints", jobs never acquired a runner and ran zero steps),
# so both jobs pin stable labels instead. Note that `macos-15` is the arm64
# label and `macos-15-intel` is x86_64. `runner.os` reports "macOS" for both
# runners, so the cargo cache key is scoped by `matrix.arch` — otherwise the
# two jobs would restore each other's wrong-architecture build artifacts.
#
# GStreamer is installed with Homebrew because gstreamer-sys and friends locate
# their libraries via pkg-config at build time; PKG_CONFIG_PATH must include
# both the general Homebrew pkgconfig dir and the gstreamer formula's dir.
# Camera / screen / system-audio capture are Linux-only at runtime — GStreamer
# is bundled only as a build dependency here, not shipped in the ZIP.
on:
  push:
  pull_request:
    branches:
      - main
      - rust-hybrid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-portable:
    name: Build portable macOS app bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            artifact: vmodv-native-macos-x86_64-portable
            zip_prefix: VmodV-Native-macOS-x86_64-portable-
          - arch: arm64
            runner: macos-15
            artifact: vmodv-native-macos-arm64-portable
            zip_prefix: VmodV-Native-macOS-arm64-portable-
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tools/version.sh derives the version from tags.

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install GStreamer (Homebrew)
        # gstreamer-sys build scripts use pkg-config to find the GStreamer
        # libraries, so the devel headers/pkgconfig files are required.
        run: brew install pkg-config gstreamer gst-plugins-base

      - name: Configure GStreamer pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gstreamer)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build modv (release)
        run: cargo build --release --manifest-path crates/Cargo.toml -p modv-app --bin modv

      - name: Resolve version
        run: echo "MACOS_VERSION=$(bash tools/version.sh)" >> "$GITHUB_ENV"

      - name: Stage portable app bundle
        run: |
          bash tools/macos-portable.sh \
            --root "$PWD/dist/macos-portable-${{ matrix.arch }}" \
            --binary "$PWD/crates/target/release/modv" \
            --project-root "$PWD"

      - name: Ad-hoc codesign the .app
        # Ad-hoc signing lets the bundled binary run without notarization.
        # continue-on-error keeps packaging/upload working on runners where
        # signing is unavailable.
        continue-on-error: true
        run: codesign --force --deep --sign - "$PWD/dist/macos-portable-${{ matrix.arch }}/VmodV.app"

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$PWD/dist/macos-portable-${{ matrix.arch }}" \
            "$PWD/dist/${{ matrix.zip_prefix }}$MACOS_VERSION.zip"

      - name: Upload portable macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip_prefix }}*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
