<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>VmodV — browser</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07070b;
        --fg: #d8ffe6;
        --accent: #45ff9a;
        --muted: #6f8f7e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #modv-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 40%, rgba(69, 255, 154, 0.08), transparent 45%),
          var(--bg);
        transition: opacity 240ms ease;
        z-index: 10;
      }
      #boot.hidden { opacity: 0; }
      #boot .card {
        pointer-events: auto;
        min-width: min(460px, 86vw);
        padding: 22px 24px;
        border: 1px solid rgba(69, 255, 154, 0.28);
        border-radius: 4px;
        background: rgba(7, 7, 11, 0.92);
        box-shadow: 0 0 60px rgba(69, 255, 154, 0.06);
      }
      #boot h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      #boot p { margin: 6px 0; color: var(--muted); }
      #boot .err {
        color: #ff7b7b;
        white-space: pre-wrap;
        max-height: 32vh;
        overflow: auto;
      }
      #boot code { color: var(--fg); }
      #audio-controls {
        position: fixed;
        right: 14px;
        bottom: 34px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      #mic-device {
        max-width: 230px;
        padding: 5px 7px;
        border: 1px solid rgba(69, 255, 154, 0.28);
        border-radius: 3px;
        background: rgba(7, 7, 11, 0.9);
        color: var(--muted);
        font: inherit;
        font-size: 11px;
      }
      #mic {
        padding: 7px 12px;
        border: 1px solid rgba(69, 255, 154, 0.45);
        border-radius: 3px;
        background: rgba(7, 7, 11, 0.86);
        color: var(--accent);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #mic:hover { background: rgba(69, 255, 154, 0.12); }
      #mic:disabled { color: var(--muted); cursor: default; }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 34px;
        z-index: 30;
        transform: translateX(-50%);
        padding: 8px 14px;
        border: 1px solid rgba(69, 255, 154, 0.45);
        border-radius: 3px;
        background: rgba(7, 7, 11, 0.94);
        color: var(--accent);
        font-size: 12px;
        white-space: nowrap;
      }
      #toast.hidden { display: none; }
      #modv-output-canvas {
        position: fixed;
        left: 0;
        top: 0;
        width: 960px;
        height: 540px;
        opacity: 0.001;
        pointer-events: none;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <canvas id="modv-output-canvas" width="960" height="540" aria-hidden="true"></canvas>
    <canvas id="modv-canvas" tabindex="0"></canvas>
    <div id="audio-controls">
      <select id="mic-device" title="Microphone input">
        <option value="">Default microphone</option>
      </select>
      <button id="mic" type="button">Use microphone</button>
    </div>
    <div id="toast" class="hidden" role="status"></div>
    <div id="boot">
      <div class="card">
        <h1>VMODV / WEB</h1>
        <p id="boot-status">Starting the WebGPU compositor…</p>
        <p class="err" id="boot-error"></p>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
