[package]
name = "modv-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VmodV UI (egui)"

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# `std::time::Instant`/`SystemTime` panic on wasm32-unknown-unknown.
web-time = "1.1"

[dev-dependencies]
accesskit = "0.25.2"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
# Test-only: pins the `Point10 ` -> `Plane9 ` alias fallback in
# `EngineSnapshot::registered_module` to the renderer's canonical roster.
# Dev-dependencies are not compiled into the wasm shell.
modv-renderers = { version = "0.1.0", path = "../modv-renderers" }
