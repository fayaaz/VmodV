[package]
name = "modv-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "modV engine"

[dependencies]
bytemuck = "1.25.2"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
