[package]
name = "modv-renderers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "modV engine"

[dependencies]
bytemuck = "1.25.2"
cosmic-text = "0.19"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indexmap = { version = "2", features = ["serde"] }
naga = { version = "30.0.1", features = ["glsl-in", "spv-in", "spv-out", "wgsl-in", "wgsl-out"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
