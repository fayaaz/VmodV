[package]
name = "modv-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "modV engine"

[dependencies]
boa_engine = { version = "0.22.0", default-features = false }
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"

# Boa's `rand` dependency needs an explicit entropy backend on
# wasm32-unknown-unknown. Unifying the feature here keeps the engine crate
# buildable for both the native app and the browser shell.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
