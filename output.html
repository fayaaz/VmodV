<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VmodV — output</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #output-video {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        background: #000;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
        color: #8b8b96;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #boot .card {
        max-width: 34rem;
        padding: 1.2rem 1.4rem;
        border: 1px solid #1f2a24;
        background: #07070b;
      }
      #boot h1 {
        margin: 0 0 0.7rem;
        color: #45ff9a;
        font-size: 14px;
        letter-spacing: 0.14em;
      }
      #boot .err { color: #ff6b6b; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <video id="output-video" autoplay muted playsinline></video>
    <div id="boot">
      <div class="card">
        <h1>VMODV / OUTPUT</h1>
        <p id="boot-status">Waiting for the main VmodV window…</p>
        <p class="err" id="boot-error"></p>
      </div>
    </div>
    <script type="module" src="./output.js"></script>
  </body>
</html>
